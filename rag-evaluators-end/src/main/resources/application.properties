spring.ai.google.genai.api-key=<your-Gemini-key>
spring.ai.google.genai.chat.model=gemini-2.5-flash
spring.ai.google.genai.embedding.api-key=<your-Gemini-key>
spring.ai.google.genai.embedding.text.model=gemini-embedding-001

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=none

management.endpoints.web.exposure.include=*
